name: "Builder images"
# Manually build the manylinux builder images the Python-wheel jobs in cd.yml run in
# (ghcr.io/virtualcell/fvsolver_manylinux_<glibc>_<arch>). The solver image itself,
# ghcr.io/virtualcell/vcell-fvsolver, is built by container.yml from the top-level Dockerfile.
on:
  workflow_dispatch:
    inputs:
      glibc:
        description: 'manylinux baseline of the builder image'
        required: true
        type: choice
        default: "2_28"
        options:
          - "2_28"
          - "2_34"
      tag:
        description: "Tag for the Docker image"
        required: true
        default: "latest"
      push:
        description: "Push docker image to container registry once built?"
        required: true
        type: boolean
        default: false


jobs:
  deployment:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ubuntu-latest
            arch: "x86_64"
          - name: ubuntu-24.04-arm
            arch: "aarch64"
    runs-on: ${{ matrix.platform.name }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile_fvsolver_manylinux_${{ inputs.glibc }}_${{ matrix.platform.arch }}
          push: ${{ inputs.push }}
          tags: ghcr.io/virtualcell/fvsolver_manylinux_${{ inputs.glibc }}_${{ matrix.platform.arch }}:${{ inputs.tag }}
