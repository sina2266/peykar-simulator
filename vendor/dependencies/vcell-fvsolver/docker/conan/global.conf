# Fetch sources from ConanCenter's backup-sources mirror first: upstream hosts (gitlab.dkrz.de
# for libaec, among others) answer GitHub runners with HTTP 429 when many jobs build at once.
core.sources:download_urls=["https://c3i.jfrog.io/artifactory/conan-center-backup-sources/", "origin"]
core.download:retry=5
core.download:retry_wait=15
