[build-system]
requires = ["scikit-build-core>=0.10", "pybind11"]
build-backend = "scikit_build_core.build"


[project]
name = "pyvcell_stochastic"
version = "0.1.0"
description = "Virtual Cell stochastic (Gibson) solver"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Jim Schaff", email = "schaff@uchc.edu" },
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
test = ["pytest"]


[tool.scikit-build]
# Both the extension and the vcellstochastic.py wrapper are installed by
# python/CMakeLists.txt, so there is no package directory to auto-discover.
wheel.packages = []
wheel.expand-macos-universal-tags = true
# Only the "python" install component goes into the wheel; the static
# libraries, headers and the VCellStoch executable installed by the other
# CMakeLists.txt files are deliberately left out.
install.components = ["python"]
cmake.define.BUILD_TESTING = "OFF"
# Development.Module requires CMake 3.18.
cmake.version = ">=3.18"
# Build in-tree rather than in a temporary directory. On Windows the temp
# directory cleanup raced with lingering MSBuild worker nodes still holding a
# handle on build/VCellStoch, and TemporaryDirectory's retry loop turned that
# PermissionError into a RecursionError that failed the build after the wheel
# had already been made successfully.
build-dir = "build/{wheel_tag}"
# The wheel only needs the extension module, so don't spend four MSVC builds of
# the VCellStoch executable per platform on something install.components
# excludes anyway.
build.targets = ["vcellstochastic_py"]


[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
log_cli_level = "INFO"
filterwarnings = [
    "error",
]
testpaths = ["python/tests"]


[tool.cibuildwheel]
build = ["cp39-*", "cp310-*", "cp311-*", "cp312-*"]
skip = ["*-musllinux_*", "*_i686"]
test-command = "pytest {project}/python/tests"
test-extras = ["test"]
test-skip = ["*universal2:arm64"]
build-verbosity = 1
archs = ["native"]

[tool.cibuildwheel.linux]
# Linux wheels are built inside the manylinux container, so HDF5 has to be
# installed there rather than on the runner. auditwheel then vendors libhdf5
# into the wheel.
# Pinned to a dated image rather than the "manylinux_2_28" alias: the image
# cibuildwheel pins for that alias carried gcc-toolset-12, and the C++20
# <format> that vcell-expressionparser includes needs GCC 13 or newer. This tag
# carries gcc-toolset-14. Same glibc 2.28 floor, so wheel compatibility is
# unchanged. This image no longer ships cp38, which cibuildwheel 2.21.3 used
# internally, hence the bump to 2.23.4 in the workflow.
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64:2026.09.23-1"
manylinux-aarch64-image = "quay.io/pypa/manylinux_2_28_aarch64:2026.09.23-1"
before-all = "dnf install -y epel-release && dnf config-manager --set-enabled powertools && dnf install -y hdf5-devel"
