[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "peykar-core"
version = "0.3.0"
description = "Engine-independent scientific contracts for Peykar"
requires-python = ">=3.12,<3.14"
license = "LicenseRef-Peykar-Noncommercial-1.1.0"
license-files = ["LICENSE", "NOTICE", "LICENSING.md", "licenses/*.txt", "licenses/*.json"]
dependencies = ["pydantic>=2.10,<3", "pint>=0.24,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/peykar_core"]
