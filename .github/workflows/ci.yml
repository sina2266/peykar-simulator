name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm --prefix apps/dashboard ci --ignore-scripts --no-fund --no-audit
      - run: make dashboard
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --all-packages --group dev --python ${{ matrix.python-version }}
      - run: make check
      - run: uv run peykar demo
      - run: make build
