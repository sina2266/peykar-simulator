[project]
name = "peykar-runtime-gears"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cell-gears", "torch==2.5.1+cpu", "torch-geometric==2.6.1", "anndata==0.10.9"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.workspace]
members = []

[tool.uv.sources]
cell-gears = { path = "../../vendor/upstream/gears" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
